<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Helpdesk Assurance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .table-container::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .sticky-col {
            position: -webkit-sticky;
            position: sticky;
            left: 0;
            z-index: 10;
        }
         .sticky-col-name {
            position: -webkit-sticky;
            position: sticky;
            left: 50px; /* Adjust this based on the width of the 'No' column */
            z-index: 10;
        }
        .weekend {
            background-color: #fee2e2 !important; /* light red for weekends */
        }
        #search-results div:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-8">

    <!-- Login Overlay -->
    <div id="login-overlay" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-sm">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Login</h2>
            <form id="login-form">
                <div class="mb-4">
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" name="username" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" required>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" required>
                </div>
                <p id="error-message" class="text-red-500 text-sm text-center mb-4 hidden"></p>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                    Masuk
                </button>
            </form>
        </div>
    </div>

    <!-- Main Content (Initially hidden) -->
    <main id="schedule-content" class="hidden">
        <div class="max-w-full mx-auto bg-white rounded-2xl shadow-lg p-6">
            <!-- Header -->
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">Jadwal Helpdesk Assurance</h1>
                <div class="flex items-center gap-4 flex-wrap justify-center sm:justify-end">
                    <!-- Search Input -->
                    <div class="relative">
                        <input type="text" id="name-search" placeholder="Cari nama karyawan..." class="p-2 border rounded-md shadow-sm w-48 sm:w-64">
                        <div id="search-results" class="absolute z-20 w-full bg-white border rounded-md mt-1 max-h-60 overflow-y-auto hidden"></div>
                    </div>
                    <div class="flex items-center gap-2">
                        <select id="month-select" class="p-2 border rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"></select>
                        <select id="year-select" class="p-2 border rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"></select>
                    </div>
                </div>
            </div>

            <!-- Table View -->
            <div id="table-view">
                <div id="schedule-container" class="table-container overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 border border-gray-200">
                        <thead id="schedule-head" class="bg-gray-50"></thead>
                        <tbody id="schedule-body" class="bg-white divide-y divide-gray-200"></tbody>
                        <tfoot id="schedule-foot" class="bg-gray-100 font-semibold"></tfoot>
                    </table>
                </div>
                <div class="mt-6 p-4 bg-gray-50 rounded-lg">
                    <h3 class="text-lg font-semibold mb-2 text-gray-700">Keterangan Jadwal</h3>
                    <div id="legend" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
                </div>
            </div>

            <!-- Calendar View (Initially hidden) -->
            <div id="calendar-view" class="hidden">
                <!-- Calendar will be generated by JS -->
            </div>
        </div>
    </main>

    <script>

                },

                    "schedule": ["S","P","L","S","S","P","P","P","L","L","P","L","C","L","P","P","P","P","P","L","L","S","S","P","P","L","L","S","S","P","P"]

                },

                },
                "20921117": {

                    "mappingArea": "LOGIC",

                },
                "18970553": {

                    "mappingArea": "LOGIC",
                    "schedule": ["P","P","P","L","L","S","M","P","M","M","S","L","L","S","M","M","P","L","L","P","M","P","M","L","L","M","S","S","L","P","P"]
                },
                "20920839": {
                    "name": "I DEWA KETUT SURYA ADI P",
                    "mappingArea": "LOGIC",
                    "schedule": ["P","S","M","L","L","M","S","M","P","M","L","L","S","P","M","C","C","L","L","L","P","S","M","P","M","L","L","P","P","S","M"]
                },
                "20980865": {
                    "name": "I PUTU ADITYA SURYA DARMAWAN",
                    "mappingArea": "LOGIC",
                    "schedule": ["M","P","S","M","L","L","M","S","P","P","L","L","P","M","P","P","S","S","L","L","P","P","P","S","L","L","P","M","S","L","P"]
                },
                "16040932": {
                    "name": "I KOMANG ANGGARA DANA",
                    "mappingArea": "LOGIC",
                    "schedule": ["M","L","L","S","M","P","P","L","L","S","M","P","P","L","P","S","L","L","P","S","M","M","S","M","L","L","M","P","M","M","S"]
                }
            };
            const shiftInfo = {
                'P7': { name: 'Pagi 1', time: '07.00 - 16.00', color: 'bg-green-100', textColor: 'text-green-800' },
                'P': { name: 'Pagi 2', time: '08.00 - 17.00', color: 'bg-blue-100', textColor: 'text-blue-800' },
                'M': { name: 'Siang', time: '14.00 - 22.00', color: 'bg-yellow-100', textColor: 'text-yellow-800' },
                'S': { name: 'Middle', time: '10.00 - 19.00', color: 'bg-orange-100', textColor: 'text-orange-800' },
                'L': { name: 'Libur', time: '-', color: 'bg-gray-200', textColor: 'text-gray-800' },
                'C': { name: 'Cuti', time: '-', color: 'bg-red-200', textColor: 'text-red-800' },
                '0': { name: 'Off', time: '-', color: 'bg-gray-100', textColor: 'text-gray-400' },
            };
            
            const shiftTooltips = {
                'P7': 'PAGI JAM 7',
                'P': 'PAGI JAM 8',
                'M': 'MIDDLE',
                'S': 'SIANG',
                'L': 'LIBUR',
                'C': 'CUTI',
                '0': 'OFF'
            };

            // --- DOM ELEMENTS ---
            const loginOverlay = document.getElementById('login-overlay');
            const scheduleContent = document.getElementById('schedule-content');
            const loginForm = document.getElementById('login-form');
            const errorMessage = document.getElementById('error-message');
            const monthSelect = document.getElementById('month-select');
            const yearSelect = document.getElementById('year-select');
            const scheduleHead = document.getElementById('schedule-head');
            const scheduleBody = document.getElementById('schedule-body');
            const scheduleFoot = document.getElementById('schedule-foot');
            const legendContainer = document.getElementById('legend');
            const nameSearchInput = document.getElementById('name-search');
            const searchResultsContainer = document.getElementById('search-results');
            const tableView = document.getElementById('table-view');
            const calendarView = document.getElementById('calendar-view');

            // --- STATE VARIABLES ---
            let current_date = new Date(2025, 9, 1); // Oktober 2025
            let currentView = 'table'; // 'table' or 'calendar'
            let selectedEmployeeNik = null;
            
            // --- LOGIN LOGIC ---
            loginForm.addEventListener('submit', function(event) {
                event.preventDefault();
                const usernameInput = document.getElementById('username').value;
                const passwordInput = document.getElementById('password').value;
                if (usernameInput === 'OPS_DPS' && passwordInput === 'OPSDPS000') {
                    loginOverlay.classList.add('hidden');
                    scheduleContent.classList.remove('hidden');
                } else {
                    errorMessage.textContent = 'Username atau password salah.';
                    errorMessage.classList.remove('hidden');
                    document.getElementById('password').value = '';
                }
            });

            // --- SEARCH LOGIC ---
            nameSearchInput.addEventListener('input', () => {
                const query = nameSearchInput.value.toLowerCase();
                searchResultsContainer.innerHTML = '';

                if (query.length < 2) {
                    searchResultsContainer.classList.add('hidden');
                    return;
                }

                const results = Object.entries(scheduleData).filter(([nik, data]) => 
                    data.name.toLowerCase().includes(query)
                );

                if (results.length > 0) {
                    results.forEach(([nik, data]) => {
                        const resultItem = document.createElement('div');
                        resultItem.className = 'p-2 cursor-pointer';
                        resultItem.textContent = data.name;
                        resultItem.dataset.nik = nik;
                        searchResultsContainer.appendChild(resultItem);
                    });
                    searchResultsContainer.classList.remove('hidden');
                } else {
                    searchResultsContainer.classList.add('hidden');
                }
            });

            searchResultsContainer.addEventListener('click', (event) => {
                if (event.target.dataset.nik) {
                    selectedEmployeeNik = event.target.dataset.nik;
                    switchToCalendarView();
                    nameSearchInput.value = '';
                    searchResultsContainer.classList.add('hidden');
                }
            });
            
            // --- VIEW SWITCHING ---
            function switchToTableView() {
                currentView = 'table';
                selectedEmployeeNik = null;
                calendarView.classList.add('hidden');
                tableView.classList.remove('hidden');
                renderScheduleTable();
            }

            function switchToCalendarView() {
                currentView = 'calendar';
                tableView.classList.add('hidden');
                calendarView.classList.remove('hidden');
                renderEmployeeCalendar();
            }

            // --- DATE & RENDER LOGIC ---
            function populateSelectors() {
                const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
                months.forEach((month, index) => {
                    monthSelect.add(new Option(month, index));
                });
                const currentYear = new Date().getFullYear();
                for (let i = currentYear - 5; i <= currentYear + 5; i++) {
                    yearSelect.add(new Option(i, i));
                }
                monthSelect.value = current_date.getMonth();
                yearSelect.value = current_date.getFullYear();
                monthSelect.addEventListener('change', updateDate);
                yearSelect.addEventListener('change', updateDate);
            }

            function updateDate() {
                current_date = new Date(parseInt(yearSelect.value), parseInt(monthSelect.value), 1);
                if (currentView === 'table') {
                    renderScheduleTable();
                } else {
                    renderEmployeeCalendar();
                }
            }
            
            // --- RENDER CALENDAR VIEW ---
            function renderEmployeeCalendar() {
                if (!selectedEmployeeNik) return;

                const employee = scheduleData[selectedEmployeeNik];
                const year = current_date.getFullYear();
                const month = current_date.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDayOfMonth = new Date(year, month, 1).getDay(); // 0=Sun, 1=Mon...
                const dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

                let calendarHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-gray-800">${employee.name}</h2>
                        <button id="back-to-table" class="bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700">Kembali ke Jadwal</button>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center font-semibold text-gray-600">
                        ${dayNames.map(d => `<div>${d}</div>`).join('')}
                    </div>
                    <div class="grid grid-cols-7 gap-1 mt-2">
                `;

                // Add empty cells for days before the 1st
                for (let i = 0; i < firstDayOfMonth; i++) {
                    calendarHTML += `<div class="border rounded-md bg-gray-50"></div>`;
                }

                // Add day cells
                for (let day = 1; day <= daysInMonth; day++) {
                     const shift = (year === 2025 && month === 9 && employee.schedule && employee.schedule[day - 1]) ? employee.schedule[day - 1] : '-';
                     const shiftClass = shiftInfo[shift] ? `${shiftInfo[shift].color} ${shiftInfo[shift].textColor}` : '';
                     // EDIT: Tampilkan teks lengkap langsung di kalender, bukan kode shift.
                     const displayText = shiftTooltips[shift] || shift;
                     calendarHTML += `
                         <div class="border rounded-md p-2 h-24 ${shiftClass} flex flex-col">
                             <div class="font-bold text-left">${day}</div>
                             <div class="text-center text-sm font-bold mt-2 flex-grow flex items-center justify-center break-words">${displayText}</div>
                         </div>
                     `;
                }
                calendarHTML += `</div>`;
                calendarView.innerHTML = calendarHTML;
                
                document.getElementById('back-to-table').addEventListener('click', switchToTableView);
            }

            // --- RENDER TABLE VIEW ---
            function renderScheduleTable() {
                const year = current_date.getFullYear();
                const month = current_date.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

                scheduleHead.innerHTML = '';
                scheduleBody.innerHTML = '';
                scheduleFoot.innerHTML = '';

                const headerRow = document.createElement('tr');
                headerRow.innerHTML = `<th class="sticky-col bg-gray-50 p-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-r">No</th><th class="sticky-col-name bg-gray-50 p-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-r">Nama</th>`;
                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(year, month, day);
                    const isWeekend = date.getDay() === 0 || date.getDay() === 6;
                    headerRow.innerHTML += `<th class="p-2 text-xs font-medium text-gray-500 uppercase tracking-wider text-center ${isWeekend ? 'weekend' : ''}"><div>${day}</div><div class="font-normal">${dayNames[date.getDay()]}</div></th>`;
                }
                headerRow.innerHTML += `<th class="p-2 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">P7</th><th class="p-2 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">P</th><th class="p-2 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">M</th><th class="p-2 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">S</th><th class="p-2 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">L/C</th><th class="p-2 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Hadir</th><th class="p-2 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">HK</th>`;
                scheduleHead.appendChild(headerRow);

                let employeeIndex = 1;
                const dailyTotals = Array(daysInMonth + 1).fill(0).map(() => ({}));
                const sortedEmployees = Object.values(scheduleData).sort((a, b) => a.mappingArea.localeCompare(b.mappingArea) || a.name.localeCompare(b.name));
                let currentArea = null;
                const totalColumns = daysInMonth + 2 + 7;

                sortedEmployees.forEach(employee => {
                    if (employee.mappingArea !== currentArea) {
                        currentArea = employee.mappingArea;
                        const areaRow = document.createElement('tr');
                        areaRow.className = 'bg-gray-200 font-bold';
                        areaRow.innerHTML = `<td colspan="${totalColumns}" class="p-2 text-left text-gray-800 uppercase sticky-col">${currentArea}</td>`;
                        scheduleBody.appendChild(areaRow);
                    }
                    
                    const employeeRow = document.createElement('tr');
                    let rowHTML = `<td class="sticky-col bg-white p-2 whitespace-nowrap text-sm text-gray-500 border-r text-center">${employeeIndex++}</td><td class="sticky-col-name bg-white p-2 whitespace-nowrap text-sm font-medium text-gray-900 border-r">${employee.name}</td>`;
                    let shiftCounts = { P7: 0, P: 0, M: 0, S: 0, L: 0, C: 0, '0': 0 };
                    
                    for (let day = 1; day <= daysInMonth; day++) {
                        const date = new Date(year, month, day);
                        const isWeekend = date.getDay() === 0 || date.getDay() === 6;
                        // Only try to get schedule if it's for the month with data
                        const shift = (year === 2025 && month === 9 && employee.schedule && employee.schedule[day - 1]) ? employee.schedule[day - 1] : '-';
                        
                        if (shift !== '-' && shiftInfo[shift]) {
                            shiftCounts[shift]++;
                            if (!dailyTotals[day][shift]) dailyTotals[day][shift] = 0;
                            dailyTotals[day][shift]++;
                        }
                        
                        const shiftClass = shiftInfo[shift] ? `${shiftInfo[shift].color} ${shiftInfo[shift].textColor}` : '';
                        
                        rowHTML += `<td class="p-2 whitespace-nowrap text-sm text-center font-semibold ${shiftClass} ${isWeekend ? 'weekend' : ''}">${shift}</td>`;
                    }
                    
                    const totalHadir = shiftCounts.P7 + shiftCounts.P + shiftCounts.M + shiftCounts.S;
                    const totalHK = totalHadir + shiftCounts.C;
                    rowHTML += `<td class="p-2 whitespace-nowrap text-sm text-gray-500 text-center">${shiftCounts.P7}</td><td class="p-2 whitespace-nowrap text-sm text-gray-500 text-center">${shiftCounts.P}</td><td class="p-2 whitespace-nowrap text-sm text-gray-500 text-center">${shiftCounts.M}</td><td class="p-2 whitespace-nowrap text-sm text-gray-500 text-center">${shiftCounts.S}</td><td class="p-2 whitespace-nowrap text-sm text-gray-500 text-center">${shiftCounts.L + shiftCounts.C}</td><td class="p-2 whitespace-nowrap text-sm text-gray-500 text-center font-bold">${totalHadir}</td><td class="p-2 whitespace-nowrap text-sm text-gray-500 text-center font-bold">${totalHK}</td>`;
                    employeeRow.innerHTML = rowHTML;
                    scheduleBody.appendChild(employeeRow);
                });


                if (year === 2025 && month === 9) {
                    let footerRowHTML = `<td colspan="2" class="p-2 text-right text-sm text-gray-700">TOTAL HADIR</td>`;
                    let grandTotalHadir = 0;
                    for (let day = 1; day <= daysInMonth; day++) {
                        const dailyHadir = Object.keys(dailyTotals[day]).reduce((acc, shift) => acc + (shift !== 'L' && shift !== 'C' && shift !== '0' ? dailyTotals[day][shift] : 0), 0);
                        grandTotalHadir += dailyHadir;
                        footerRowHTML += `<td class="p-2 text-center text-sm">${dailyHadir}</td>`;
                    }
                    // The colspan for the empty cells at the end is 7 (for the summary columns)
                    footerRowHTML += `<td colspan="7"></td>`;
                    scheduleFoot.innerHTML = `<tr>${footerRowHTML}</tr>`;
                }
            }


            function renderLegend() {
                legendContainer.innerHTML = Object.entries(shiftInfo).map(([key, info]) => `
                    <div class="flex items-center gap-2">
                        <div class="w-5 h-5 rounded ${info.color} border border-gray-300 flex items-center justify-center font-bold ${info.textColor}">${key}</div>
                        <span class="text-sm text-gray-600">${info.name} (${info.time})</span>
                    </div>`).join('');
            }

            // --- INISIALISASI ---
            populateSelectors();
            renderScheduleTable();
            renderLegend();
        });
    </script>
</body>
</html>
